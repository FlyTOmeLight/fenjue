name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          sudo apt-get update && sudo apt-get install -y tmux build-essential
          tmux -V
          uname -m
      - run: npm run check
      - run: npm test
      - run: npm run verify:terminal
      - run: npm start -- --help
      - run: npm run eval:native:classifier -- --config examples/native-balanced.json
      - run: npm run eval:tasks -- --dry-run
